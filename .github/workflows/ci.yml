name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # gitleaks scans history; a shallow clone gives it one commit.
                  fetch-depth: 0
                  persist-credentials: false

            # glib-compile-schemas validates the gschema; it is not a mise tool
            # because it must match the GLib the target Shell was built against.
            - name: Install GLib schema compiler
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libglib2.0-bin

            - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

            - run: npm ci

            # The docs site's suite runs in real browsers.
            - name: Install test browsers
              run: npx playwright install --with-deps chromium firefox

            # The same recipe a developer runs: lint, test, test-docs, security, build.
            - run: just ci
